name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang dependensi
        run: npm install

      - name: Buat project Android
        run: npx cap add android

      - name: Ikon dan splash
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: Nomor versi
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Ganti nama
        run: cp android/app/build/outputs/apk/debug/app-debug.apk JiyyChat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JiyyChat-apk
          path: JiyyChat.apk

      - name: Rilis (unduh langsung dari HP)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Jiyy Chat APK ${{ github.run_number }}
          files: JiyyChat.apk
          
